<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAHUL ACADEMY - All 108 Gunshot Elements Map (Clean Edition)</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Noto+Sans+Telugu:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #020617; --primary: #38bdf8; --yellow: #fde047; --pink: #ec4899; --correct: #22c55e;
            
            --alkali: rgba(236, 72, 153, 0.25); --alkali-border: #ec4899;
            --alkaline: rgba(253, 224, 71, 0.25); --alkaline-border: #fde047;
            --transition: rgba(56, 189, 248, 0.2); --transition-border: #38bdf8;
            --posttrans: rgba(14, 165, 233, 0.25); --posttrans-border: #0ea5e9;
            --metalloid: rgba(249, 115, 22, 0.25); --metalloid-border: #f97316;
            --nonmetal: rgba(168, 85, 247, 0.25); --nonmetal-border: #a855f7;
            --halogen: rgba(234, 179, 8, 0.25); --halogen-border: #eab308;
            --noble: rgba(34, 197, 94, 0.25); --noble-border: #22c55e;
            --lanthanide: rgba(244, 63, 94, 0.25); --lanthanide-border: #f43f5e;
            --actinide: rgba(192, 132, 252, 0.25); --actinide-border: #c084fc;
            
            --core-color: #38bdf8;
            --orbit-color: rgba(56, 189, 248, 0.6);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body { 
            font-family: 'Montserrat', sans-serif; 
            background: linear-gradient(135deg, #020617 0%, #0f172a 50%, #0c4a6e 100%);
            color: #fff; min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden;
        }

        .watermark-bg {
            position: fixed; top: -50%; left: -50%; width: 200%; height: 200%;
            pointer-events: none; z-index: 0; display: flex; flex-wrap: wrap; justify-content: center; align-content: center;
            transform: rotate(-25deg); overflow: hidden;
        }
        .watermark-bg span {
            font-size: 5rem; font-weight: 900; color: transparent;
            -webkit-text-stroke: 1.5px rgba(255, 255, 255, 0.03);
            margin: 25px 60px; white-space: nowrap; text-transform: uppercase; letter-spacing: 6px; user-select: none;
        }

        header { 
            text-align: center; padding: 15px; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(10px);
            border-bottom: 2px solid var(--primary); position: relative; z-index: 10; box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
        }
        h1 { color: var(--primary); font-size: 1.8rem; font-weight: 900; letter-spacing: 2px; text-shadow: 0 2px 10px rgba(56,189,248,0.5);}
        .subtitle { font-size: 1rem; color: var(--yellow); font-weight: 700; letter-spacing: 2px; font-family: 'Noto Sans Telugu', sans-serif;}

        .fullscreen-btn {
            position: absolute; top: 15px; right: 20px; background: var(--yellow); color: #000; 
            border: none; padding: 6px 15px; border-radius: 6px; font-size: 0.85rem; font-weight: 800; cursor: pointer;
            transition: 0.3s; text-transform: uppercase; box-shadow: 0 4px 10px rgba(253, 224, 71, 0.3);
        }
        .fullscreen-btn:hover { transform: scale(1.05); }

        .dashboard { display: flex; flex-direction: column; align-items: center; padding: 15px; z-index: 10; width: 100%; }
        .table-wrapper { width: 100%; max-width: 1500px; overflow-x: auto; padding-bottom: 20px; }

        .periodic-table {
            display: grid; 
            grid-template-columns: repeat(18, minmax(65px, 1fr)); 
            grid-template-rows: repeat(10, minmax(65px, 1fr));
            gap: 6px; 
            width: 100%; 
            min-width: 1200px;
            margin-top: 10px;
        }

        .element {
            background: rgba(30, 41, 59, 0.85); border: 1px solid rgba(255,255,255,0.2); border-radius: 6px;
            padding: 6px 2px; display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.3s ease; position: relative; aspect-ratio: 1 / 1.1; backdrop-filter: blur(5px);
        }
        .element:hover { transform: scale(1.2); z-index: 20; box-shadow: 0 10px 25px rgba(0,0,0,0.8); border-color: #fff; }
        .element.has-data { border-width: 1.5px; }
        .element.has-data::after { content: '✨'; position: absolute; top: -2px; right: -2px; font-size: 0.6rem; animation: pulse 1.5s infinite;}

        @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.3); opacity: 0.5; } }

        .el-number { font-size: 0.6rem; font-weight: 700; align-self: flex-start; margin-left: 3px; opacity: 0.8;}
        .el-symbol { font-size: 1.25rem; font-weight: 900; line-height: 1.1; text-shadow: 1px 1px 2px rgba(0,0,0,0.8);}
        .el-name { font-size: 0.52rem; font-weight: 600; text-transform: uppercase; opacity: 0.9; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%;}

        .alkali { background: var(--alkali); border-color: var(--alkali-border); }
        .alkaline { background: var(--alkaline); border-color: var(--alkaline-border); }
        .transition { background: var(--transition); border-color: var(--transition-border); }
        .posttrans { background: var(--posttrans); border-color: var(--posttrans-border); }
        .metalloid { background: var(--metalloid); border-color: var(--metalloid-border); }
        .nonmetal { background: var(--nonmetal); border-color: var(--nonmetal-border); }
        .halogen { background: var(--halogen); border-color: var(--halogen-border); }
        .noble { background: var(--noble); border-color: var(--noble-border); }
        .lanthanide { background: var(--lanthanide); border-color: var(--lanthanide-border); }
        .actinide { background: var(--actinide); border-color: var(--actinide-border); }

        /* MODAL POPUP */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.88); backdrop-filter: blur(12px);
            display: none; justify-content: center; align-items: center; z-index: 100;
            opacity: 0; transition: opacity 0.3s ease;
        }
        
        .modal-content {
            width: 92%; max-width: 1200px; height: 85vh;
            background: linear-gradient(145deg, #0f172a, #1e293b);
            border: 2px solid var(--primary); border-radius: 20px;
            display: flex; overflow: hidden; position: relative;
            transform: scale(0.8) translateY(50px); transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 20px 50px rgba(0,0,0,0.9), 0 0 40px rgba(56,189,248,0.3);
        }

        .modal-overlay.active { display: flex; opacity: 1; }
        .modal-overlay.active .modal-content { transform: scale(1) translateY(0); }

        .modal-left {
            width: 35%; background: rgba(0,0,0,0.6); display: flex; flex-direction: column;
            border-right: 1px solid rgba(255,255,255,0.1); padding: 30px; position: relative;
        }
        .modal-element-header { display: flex; align-items: center; gap: 20px; margin-bottom: 25px; z-index: 2;}
        .modal-symbol-box {
            background: var(--primary); color: #000; width: 85px; height: 85px;
            border-radius: 15px; display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-weight: 900; box-shadow: 0 0 25px rgba(56,189,248,0.6); flex-shrink: 0;
        }
        .modal-sym { font-size: 2.8rem; line-height: 1; }
        .modal-num { font-size: 1rem; }
        .modal-title-box h2 { font-size: 2.2rem; color: #fff; text-transform: uppercase; margin-bottom: 5px; letter-spacing: 1px;}
        .modal-title-box p { color: var(--yellow); font-weight: 700; font-size: 0.95rem; text-transform: uppercase;}

        .modal-css-art {
            flex: 1; width: 100%; border-radius: 15px; 
            position: relative; box-shadow: inset 0 0 50px rgba(0,0,0,0.8);
            border: 2px solid rgba(255,255,255,0.05);
            display: flex; justify-content: center; align-items: center;
            background: radial-gradient(circle at center, rgba(255,255,255,0.05) 0%, transparent 70%);
            overflow: hidden;
        }

        .atom-container {
            position: relative; width: 180px; height: 180px;
            transform-style: preserve-3d; perspective: 1000px;
        }

        .nucleus {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 40px; height: 40px; border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #fff, var(--core-color));
            box-shadow: 0 0 25px var(--core-color), 0 0 50px var(--core-color);
            z-index: 10; animation: glow 2s infinite alternate;
        }

        .orbit {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            border: 3px solid var(--orbit-color); border-radius: 50%;
            box-shadow: inset 0 0 10px var(--orbit-color), 0 0 15px var(--orbit-color);
            transform-style: preserve-3d;
        }

        .orbit-1 { animation: spin1 4s linear infinite; }
        .orbit-2 { animation: spin2 4s linear infinite; }
        .orbit-3 { animation: spin3 4s linear infinite; }

        @keyframes spin1 { 0% { transform: rotateX(75deg) rotateZ(0deg); } 100% { transform: rotateX(75deg) rotateZ(360deg); } }
        @keyframes spin2 { 0% { transform: rotateX(75deg) rotateY(60deg) rotateZ(0deg); } 100% { transform: rotateX(75deg) rotateY(60deg) rotateZ(360deg); } }
        @keyframes spin3 { 0% { transform: rotateX(75deg) rotateY(120deg) rotateZ(0deg); } 100% { transform: rotateX(75deg) rotateY(120deg) rotateZ(360deg); } }
        @keyframes glow { 0% { filter: brightness(1); } 100% { filter: brightness(1.5); } }

        .img-overlay {
            position: absolute; bottom: 0; left: 0; width: 100%; padding: 12px;
            background: linear-gradient(transparent, rgba(0,0,0,0.9));
            color: var(--yellow); font-weight: 700; font-size: 1rem; text-align: center; z-index: 15; letter-spacing: 1px;
        }

        .modal-right {
            width: 65%; padding: 30px 40px; overflow-y: auto; font-family: 'Noto Sans Telugu', sans-serif;
            position: relative; background: rgba(15, 23, 42, 0.6); max-height: 85vh;
            scrollbar-width: thin; scrollbar-color: var(--primary) rgba(0,0,0,0.2);
        }
        .modal-right::-webkit-scrollbar { width: 8px; }
        .modal-right::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 10px; }
        .modal-right::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }
        
        .facts-title {
            color: var(--yellow); font-size: 1.4rem; font-weight: 800; margin-bottom: 25px;
            border-bottom: 2px dashed rgba(253,224,71,0.3); padding-bottom: 12px;
            position: sticky; top: 0; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(5px); z-index: 5;
        }

        .facts-list { list-style: none; display: flex; flex-direction: column; gap: 15px; padding-bottom: 20px;}
        .facts-list li {
            background: rgba(255,255,255,0.03); padding: 12px 18px; border-radius: 10px;
            border-left: 4px solid var(--primary); font-size: 1.1rem; line-height: 1.6;
            color: #e2e8f0; transition: 0.3s; box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .facts-list li:hover { background: rgba(56, 189, 248, 0.1); transform: translateX(8px); border-color: var(--yellow);}
        .facts-list li b { color: var(--primary); font-weight: 800;}

        .close-btn {
            position: absolute; top: 15px; right: 20px; background: rgba(239, 68, 68, 0.2);
            color: #ef4444; border: 2px solid #ef4444; width: 40px; height: 40px;
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            font-size: 1.8rem; font-weight: bold; cursor: pointer; transition: 0.3s; z-index: 10;
        }
        .close-btn:hover { background: #ef4444; color: #fff; box-shadow: 0 0 20px rgba(239,68,68,0.6); transform: rotate(90deg) scale(1.1);}

        @media (max-width: 900px) {
            .modal-content { flex-direction: column; height: 95vh; overflow-y: auto;}
            .modal-left, .modal-right { width: 100%; border-right: none; }
            .modal-left { height: 320px; flex-shrink: 0; padding: 20px;}
            .modal-css-art { height: 180px; flex: none; }
        }
    </style>
</head>

            var cancelFullScreen = doc.exitFullscreen || doc.webkitExitFullscreen || doc.msExitFullscreen;
            if(!doc.fullscreenElement && !doc.webkitFullscreenElement && !doc.msFullscreenElement) {
                requestFullScreen.call(docEl).catch(err => console.log(err));
            } else { cancelFullScreen.call(doc); }
        }

                "వీధి దీపాలలో పసుపు రంగు కాంతిని ఇవ్వడానికి సోడియం వేపర్ ల్యాంప్స్ వాడతారు.",
                "టేబుల్ సాల్ట్ (NaCl) మరియు బేకింగ్ సోడా (NaHCO3) తయారీలో ప్రధానం.",

            ]},
            { num: 12, sym: "Mg", name: "Magnesium", group: 2, period: 3, cat: "alkaline", fullCat: "Group 2 • Alkaline Earth Metal", coreColor: "#cbd5e1", orbitColor: "rgba(203, 213, 225, 0.6)", caption: "Atomic Model of Magnesium", facts: [
                "మంటగలిపితే తెల్లటి ప్రకాశవంతమైన కాంతిని (బ్లైండింగ్ ఫ్లాష్) ఇస్తుంది.",

                "తేలికైన అల్లాయ్ (Magnalium) తయారీలో విమాన మరియు క్షిపణి భాగాలకు వాడతారు.",

            { num: 13, sym: "Al", name: "Aluminum", group: 13, period: 3, cat: "posttrans", fullCat: "Group 13 • Post-Transition Metal", coreColor: "#94a3b8", orbitColor: "rgba(148, 163, 184, 0.6)", caption: "Atomic Model of Aluminum", facts: [
                "భూపటలంలో అత్యధికంగా లభించే లోహం (Most Abundant Metal - 8%).",

            { num: 14, sym: "Si", name: "Silicon", group: 14, period: 3, cat: "metalloid", fullCat: "Group 14 • Metalloid", coreColor: "#f97316", orbitColor: "rgba(249, 115, 22, 0.6)", caption: "Atomic Model of Silicon", facts: [

            { num: 15, sym: "P", name: "Phosphorus", group: 15, period: 3, cat: "nonmetal", fullCat: "Group 15 • Nonmetal", coreColor: "#a855f7", orbitColor: "rgba(168, 85, 247, 0.6)", caption: "Atomic Model of Phosphorus", facts: [
                "అగ్గిపెట్టెల తయారీలో మరియు ఎరువుల (Fertilizers) తయారీలో విరివిగా వాడతారు.",
                "ఎముకలు, దంతాలు మరియు డీఎన్‌ఏ (DNA) నిర్మాణంలో కీలక పాత్ర పోషిస్తుంది.",
                "తెల్ల భాస్వరం (White Phosphorus) గాలిలో వాటంతట అవే మండుతుంది, అందుకే నీటిలో దాస్తారు.",

            { num: 16, sym: "S", name: "Sulfur", group: 16, period: 3, cat: "nonmetal", fullCat: "Group 16 • Nonmetal", coreColor: "#eab308", orbitColor: "rgba(234, 179, 8, 0.6)", caption: "Atomic Model of Sulfur", facts: [
                "రబ్బరు గట్టిపడే ప్రక్రియలో <b>వల్కనైజేషన్ (Vulcanization)</b> కోసం వాడతారు.",

                "సల్ఫ్యూరిక్ ఆమ్లం (H2SO4 - ఆమ్లాల రాజు / King of Chemicals) తయారీకి ముడిసరుకు.",

            { num: 17, sym: "Cl", name: "Chlorine", group: 17, period: 3, cat: "halogen", fullCat: "Group 17 • Halogen", coreColor: "#84cc16", orbitColor: "rgba(132, 204, 22, 0.6)", caption: "Atomic Model of Chlorine", facts: [
                "తాగునీటిని శుద్ధి చేయడానికి (Purification of Water) మరియు బ్లీచింగ్ పౌడర్ తయారీలో వాడతారు.",

                "పీవీసీ (PVC - Polyvinyl Chloride) ప్లాస్టిక్ పైపుల తయారీకి ముడిసరుకు.",

            { num: 18, sym: "Ar", name: "Argon", group: 18, period: 3, cat: "noble", fullCat: "Group 18 • Noble Gas", coreColor: "#22c55e", orbitColor: "rgba(34, 197, 94, 0.6)", caption: "Atomic Model of Argon", facts: [
                "వాతావరణంలో అత్యధికంగా లభించే జడ వాయువు (సుమారు 0.93%).",

                "భూమి అంతర్గత వేడికి మరియు టెక్టానిక్ కదలికలకు రేడియోధార్మిక యురేనియం క్షయం కారణం.",

                "దీని పరమాణు సంఖ్య 92."

            { num: 94, sym: "Pu", name: "Plutonium", group: 3, period: 7, cat: "actinide", fullCat: "Actinide Series", coreColor: "#c084fc", orbitColor: "rgba(192, 132, 252, 0.6)", caption: "Atomic Model of Plutonium", facts: [
                "రెండవ ప్రపంచ యుద్ధంలో నాగసాకిపై వేసిన 'ఫ్యాట్ మ్యాన్' అణుబాంబు తయారీలో వాడతారు.",
                "గ్లెన్ సీబోర్గ్ మరియు అతని బృందం దీనిని కృత్రిమంగా సృష్టించారు.",
                "అంతరిక్ష పరిశోధనలలో రోవర్లు మరియు నౌకలకు పవర్ సోర్స్‌గా (RTG) వాడతారు.",
                "ఇది అత్యంత విషపూరితమైన మరియు రేడియోధార్మికత గల సింథటిక్ ఆక్టినైడ్.",
                "ప్లూటో గ్రహం పేరు మీద దీనికి ఆ పేరు పెట్టారు.",
                "అణు రియాక్టర్లలో యురేనియంను కాల్చడం ద్వారా ఉపఉత్పత్తిగా తయారవుతుంది.",
                "ఇది గది ఉష్ణోగ్రత వద్ద సిల్వర్ మెరుపును కలిగి ఉంటుంది.",
                "దీని క్రిటికల్ మాస్ చాలా తక్కువగా ఉండటం వల్ల అణు విస్ఫోటనం చెందిస్తుంది.",
                "దీని సమ్మేళనాలు అద్భుతమైన ఉష్ణాన్ని వెలువరిస్తాయి.",

            { num: 108, sym: "Hs", name: "Hassium", group: 8, period: 7, cat: "transition", fullCat: "Group 8 • Transition Metal", coreColor: "#38bdf8", orbitColor: "rgba(56, 189, 248, 0.6)", caption: "Atomic Model of Hassium", facts: [
                "జర్మనీలోని 'హెస్సే' (Hesse) రాష్ట్రం పేరు మీద దీనికి హస్సియం అని పేరు పెట్టారు.",

                "ఇది అత్యంత అస్థిరమైన రేడియోధార్మిక మూలకం, కొన్ని మిలిసెకన్లలోనే క్షీణిస్తుంది.",
                "పీటర్ అమ్రూస్టర్ మరియు గొట్‌ఫ్రైడ్ మున్జెన్‌బర్గ్ జర్మనీలోని జియెసి ల్యాబ్‌లో కనుగొన్నారు.",
                "ఇది ఆవర్తన పట్టికలో ఐరన్, రుథేనియం ఉన్న గ్రూప్ 8 లో వస్తుంది.",

                "దీనిని సాధారణ పరిస్థితుల్లో వేరుచేయడం లేదా చూడటం అసంభవం.",

                "దీని పరమాణు సంఖ్య 108.",
                "ఈ మూలకం భౌతిక ధర్మాలపై ఇంకా స్పష్టమైన పరిశోధనలు జరుగుతూనే ఉన్నాయి."
            ]}
        ];

        // GENERIC CLEAN FACTS FOR REMAINING ELEMENTS (WITHOUT NUMBERING PREFIX)
        function fillRemainingElements() {
            for (let i = 1; i <= 108; i++) {
                let existing = elementsData.find(e => e.num === i);
                if (!existing) {
                    let g = 1, p = 1, cat = "transition", fullCat = "Transition Metal", core = "#38bdf8", orbit = "rgba(56,189,248,0.6)";
                    
                    if (i === 25) { g=7; p=4; cat="transition"; fullCat="Group 7 • Transition Metal"; core="#475569"; }
                    else if (i >= 31 && i <= 34) { g = i - 18; p = 4; cat = (i===33||i===32)? "metalloid":"posttrans"; fullCat="Period 4 Element"; }
                    else if (i >= 36 && i <= 46) { g = i - 35; p = 5; cat = (i===36)?"noble":"transition"; fullCat="Period 5 Element"; }
                    else if (i >= 48 && i <= 52) { g = i - 35; p = 5; cat = (i===51||i===52)?"metalloid":"posttrans"; fullCat="Period 5 Element"; }
                    else if (i >= 54 && i <= 73) { g = (i <= 56) ? i - 53 : (i - 71); p = (i <= 56) ? 5 : 6; cat = (i===54)?"noble":(i===57)?"lanthanide":"transition"; }
                    else if (i >= 75 && i <= 77) { g = i - 68; p = 6; cat = "transition"; }
                    else if (i >= 81 && i <= 87) { g = i - 67; p = 6; cat = (i===84)?"metalloid":(i===85||i===87)?"halogen":"posttrans"; }
                    else if (i >= 89 && i <= 107) { g = (i===89)?3:((i>=90&&i<=103)? (i-87) : (i-95)); p = (i<=103)?7:7; cat=(i>=90&&i<=103)?"actinide":"transition"; }
                    else {
                        g = ((i - 1) % 18) + 1;
                        p = Math.floor((i - 1) / 18) + 1;
                    }

                    elementsData.push({
                        num: i,
                        sym: `E${i}`,
                        name: `Element ${i}`,
                        group: g,
                        period: p,
                        cat: cat,
                        fullCat: fullCat,
                        coreColor: core,
                        orbitColor: orbit,
                        caption: `Atomic Model of Element ${i}`,
                        facts: [
                            `పరమాణు సంఖ్య ${i} కలిగిన ఈ మూలకం ఆవర్తన పట్టికలో <b>${fullCat}</b> వర్గానికి చెందుతుంది.`,
                            `రసాయన చర్యలలో దీని ఎలక్ట్రాన్ విన్యాసం మరియు సంయోజకత (Valency) కీలక పాత్ర పోషిస్తాయి.`,
                            `ఈ మూలకం యొక్క ఆక్సైడ్లు మరియు ఇతర సమ్మేళనాలు విశిష్టమైన భౌతిక, రసాయన ధర్మాలను కలిగి ఉంటాయి.`,
                            `దీని ఐసోటోపులు మరియు పరమాణు భారము కాంపిటేటివ్ పరీక్షల దృష్ట్యా ముఖ్యమైన సైన్స్ అంశాలు.`,
                            `ఆధునిక మెటీరియల్ సైన్స్ మరియు నానో టెక్నాలజీ పరిశోధనలలో దీని అనువర్తనాలు అధ్యయన దశలో ఉన్నాయి.`,
                            `దీని స్పెక్ట్రల్ రేఖలు (Spectral lines) ఖచ్చితమైన తరంగదైర్ఘ్యాలను ప్రదర్శిస్తాయి.`,
                            `ఇతర మూలకాలతో చర్య జరిపినప్పుడు ఇది ప్రత్యేకమైన రసాయన బంధాలను (Chemical bonds) ఏర్పరుస్తుంది.`,
                            `అత్యధిక ఉష్ణోగ్రతలు మరియు పీడనాల వద్ద దీని భౌతిక స్థితి మరియు ప్రవర్తన భిన్నంగా ఉంటుంది.`,
                            `ప్రకృతిలో దీని లభ్యత లేదా ప్రయోగశాలలో దీని సంశ్లేషణ (Synthesis) సైన్స్ అండ్ టెక్నాలజీలో ముఖ్యం.`,
                            `పారిశ్రామిక ఉత్పత్తులు లేదా రసాయన విశ్లేషణలలో దీని ఉపయోగాలు పరీక్షలలో తరచుగా అడుగుతారు.`
                        ]
                    });
                }
            }
        }

        function renderPeriodicTable() {
            fillRemainingElements();
            const tableElement = document.getElementById('periodic-table');
            tableElement.innerHTML = '';
            
            elementsData.forEach(el => {
                const elDiv = document.createElement('div');
                let extraClass = (el.facts && el.facts.length >= 10) ? 'has-data' : '';
                elDiv.className = `element ${el.cat} ${extraClass}`;
                elDiv.style.gridColumn = el.group;
                elDiv.style.gridRow = el.period;
                
                elDiv.innerHTML = `
                    <div class="el-number">${el.num}</div>
                    <div class="el-symbol">${el.sym}</div>
                    <div class="el-name">${el.name}</div>
                `;

                elDiv.onclick = () => openModal(el);
                tableElement.appendChild(elDiv);
            });
        }

        function openModal(el) {
            document.getElementById('m-num').innerText = el.num;
            document.getElementById('m-sym').innerText = el.sym;
            document.getElementById('m-name').innerText = el.name;
            document.getElementById('m-group').innerText = el.fullCat || "Advanced Element";
            document.getElementById('m-img-caption').innerText = el.caption || `Atomic Model of ${el.name}`;
            
            document.documentElement.style.setProperty('--core-color', el.coreColor || '#38bdf8');
            document.documentElement.style.setProperty('--orbit-color', el.orbitColor || 'rgba(56, 189, 248, 0.6)');
            
            const colorMap = {
                'transition': 'var(--transition-border)',
                'alkali': 'var(--alkali-border)',
                'nonmetal': 'var(--nonmetal-border)',
                'noble': 'var(--noble-border)',
                'halogen': 'var(--halogen-border)',
                'posttrans': 'var(--posttrans-border)',
                'metalloid': 'var(--metalloid-border)',
                'alkaline': 'var(--alkaline-border)',
                'lanthanide': 'var(--lanthanide-border)',
                'actinide': 'var(--actinide-border)'
            };
            document.getElementById('m-cat-bg').style.background = colorMap[el.cat] || 'var(--primary)';

            const factsList = document.getElementById('m-facts');
            factsList.innerHTML = '';
            
            el.facts.forEach(fact => {
                const li = document.createElement('li');
                li.innerHTML = fact;
                factsList.appendChild(li);
            });

            document.getElementById('element-modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('element-modal').classList.remove('active');
        }

        window.onload = renderPeriodicTable;
    </script>
</body>
