<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAHUL ACADEMY - CBT Exam Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Orbitron:wght@700;900&family=Noto+Sans+Telugu:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0f172a; --primary: #0284c7; --text-light: #f8fafc;
            --card-bg: #1e293b; --yellow: #fde047; --green: #16a34a; --red: #dc2626; --purple: #9333ea;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body { 
            font-family: 'Noto Sans Telugu', 'Montserrat', sans-serif; 
            background: var(--bg-color); color: var(--text-light); 
            height: 100vh; display: flex; flex-direction: column; overflow: hidden;
        }

        header { 
            background: #1e293b; border-bottom: 3px solid #38bdf8; padding: 10px 20px; 
            display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;
        }
        header h1 { color: var(--yellow); font-size: 1rem; font-weight: 900; text-transform: uppercase; }
        
        .timer-box {
            background: var(--red); color: #fff; padding: 6px 15px; border-radius: 6px;
            font-family: 'Orbitron', sans-serif; font-size: 1.1rem; font-weight: 900;
        }

        .main-container {
            display: flex; flex-direction: column; flex-grow: 1; padding: 12px; gap: 12px; max-width: 1600px; margin: 0 auto; width: 100%; height: calc(100vh - 60px);
        }

        @media (min-width: 900px) {
            .main-container { flex-direction: row; padding: 15px; gap: 15px; }
        }

        /* LEFT: QUESTION PANEL */
        .q-panel {
            flex-grow: 1; background: var(--card-bg); border: 2px solid #334155;
            border-radius: 10px; padding: 20px; display: flex; flex-direction: column; justify-content: space-between;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); overflow-y: auto;
        }

        .q-header-info { display: flex; justify-content: space-between; font-size: 0.85rem; font-weight: 900; color: #94a3b8; border-bottom: 1px solid #334155; padding-bottom: 8px; margin-bottom: 12px; }
        .q-text-telugu { font-size: 1.25rem; font-weight: 900; color: #fff; line-height: 1.5; margin-bottom: 8px; }
        .q-text-english { font-size: 1.05rem; font-weight: 800; color: var(--yellow); line-height: 1.4; margin-bottom: 15px; border-left: 3px solid var(--yellow); padding-left: 10px; }

        .options-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
        .option-item {
            background: #0f172a; border: 2px solid #334155; padding: 12px 18px; border-radius: 8px;
            font-size: 1.05rem; font-weight: 800; cursor: pointer; transition: 0.1s; color: #f8fafc;
            display: flex; align-items: center; gap: 10px;
        }
        .option-item:hover { border-color: var(--primary); background: #172554; }
        .option-item.selected { border-color: var(--yellow); background: #1e3a8a; color: var(--yellow); }

        .nav-buttons { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; border-top: 1px solid #334155; padding-top: 12px; }
        .btn {
            background: #0284c7; color: #fff; border: none;
            padding: 10px 20px; border-radius: 6px; font-size: 0.9rem; font-weight: 900; cursor: pointer; transition: 0.2s;
        }
        .btn:hover { opacity: 0.9; }
        .btn-clear-ans { background: #475569; }
        .btn-submit { background: var(--green); width: 100%; margin-top: 10px; padding: 12px; font-size: 1rem; }

        /* RIGHT: CBT PALETTE PANEL */
        .palette-panel {
            width: 100%; max-width: 360px; background: var(--card-bg); border: 2px solid #334155; border-radius: 10px;
            padding: 15px; display: flex; flex-direction: column; gap: 12px; flex-shrink: 0;
        }
        .palette-title { font-size: 0.9rem; font-weight: 900; color: var(--yellow); text-align: center; border-bottom: 1px solid #334155; padding-bottom: 8px; }
        
        .legend-box {
            display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 0.75rem; font-weight: 800; background: #0f172a; padding: 8px; border-radius: 6px;
        }
        .legend-item { display: flex; align-items: center; gap: 6px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }

        .grid-palette {
            display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; overflow-y: auto; max-height: 250px; padding-right: 4px;
        }
        .palette-btn {
            background: #475569; border: 2px solid #334155; color: #fff; font-weight: 900;
            height: 40px; border-radius: 6px; cursor: pointer; font-size: 0.9rem; transition: 0.1s;
        }
        .palette-btn.answered { background: var(--green); border-color: #15803d; }
        .palette-btn.skipped { background: var(--red); border-color: #991b1b; }
        .palette-btn.current { border: 2px solid var(--yellow); box-shadow: 0 0 8px var(--yellow); }

        .score-card {
            background: #0f172a; border: 2px dashed var(--green); border-radius: 8px; padding: 15px; text-align: center; display: none;
        }
        .score-card h2 { color: var(--green); font-size: 1.4rem; font-weight: 900; margin-bottom: 5px; }
    </style>
</head>
<body>

    <header>
        <h1>RAHUL ACADEMY - CBT EXAM PORTAL</h1>
        <div class="timer-box" id="timer">25:00</div>
    </header>

    <div class="main-container">
        <!-- QUESTION PANEL -->
        <div class="q-panel" id="exam-screen">
            <div>
                <div class="q-header-info">
                    <span id="q-num-title">Question No. 1</span>
                    <span>Marks: +1.0, -0.25</span>
                </div>
                <div class="q-text-telugu" id="q-telugu">ప్రశ్న లోడ్ అవుతోంది...</div>
                <div class="q-text-english" id="q-english">Loading question...</div>
                
                <div class="options-list" id="options-container"></div>
            </div>

            <div>
                <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                    <button class="btn btn-clear-ans" onclick="clearAnswer()">Clear Response</button>
                    <button class="btn" style="background: var(--purple);" onclick="saveAndNext()">Save & Next</button>
                </div>
                <div class="nav-buttons">
                    <button class="btn" onclick="prevQuestion()">&lt;&lt; Previous</button>
                    <button class="btn" onclick="nextQuestion()">Next &gt;&gt;</button>
                </div>
            </div>
        </div>

        <!-- PALETTE PANEL -->
        <div class="palette-panel">
            <div class="palette-title">Question Palette</div>
            
            <div class="legend-box">
                <div class="legend-item"><span class="dot" style="background:var(--green);"></span> Answered (<span id="count-ans">0</span>)</div>
                <div class="legend-item"><span class="dot" style="background:var(--red);"></span> Not Answered (<span id="count-skip">0</span>)</div>
                <div class="legend-item"><span class="dot" style="background:#475569;"></span> Not Visited (<span id="count-not">20</span>)</div>
            </div>

            <div class="grid-palette" id="palette-grid"></div>
            
            <div class="score-card" id="score-card">
                <h2>Exam Submitted!</h2>
                <p id="score-text" style="font-size: 1.1rem; font-weight: 800; color: #fff;"></p>
            </div>

            <button class="btn btn-submit" onclick="submitExam()">Submit Exam</button>
        </div>
    </div>

    <script>
        const examQuestions = [
            {
                telugu: "వరుసగా ఉన్న 7 సంఖ్యల సగటు 224 అయినచో, మొదటి సంఖ్య ఎంత?",
                english: "The average of 7 consecutive numbers is 224. Find the first number?",
                options: ["220", "221", "222", "224"],
                correct: 1
            },
            {
                telugu: "వరుసగా ఉన్న 13 సరి సంఖ్యల సగటు 124 అయినచో, చివరి సంఖ్య ఎంత?",
                english: "The average of 13 consecutive even numbers is 124. Find the last number?",
                options: ["134", "136", "138", "140"],
                correct: 1
            },
            {
                telugu: "A మరియు B ల సగటు 24, B మరియు C ల సగటు 30, C మరియు A ల సగటు 26 అయినచో C విలువ ఎంత?",
                english: "The average of A & B is 24, B & C is 30, and C & A is 26. Find the value of C?",
                options: ["28", "30", "32", "34"],
                correct: 2
            },
            {
                telugu: "A, B, C ల సగటు 18; B, C, D ల సగటు 24; C, D, A ల సగటు 22 మరియు D, A, B ల సగటు 20 అయినచో A విలువ ఎంత?",
                english: "The average of A, B, C is 18; B, C, D is 24; C, D, A is 22; and D, A, B is 20. Find the value of A?",
                options: ["10", "12", "15", "18"],
                correct: 1
            },
            {
                telugu: "15 ఇన్నింగ్స్‌లలో బ్యాట్స్‌మన్ సగటు 40. 16వ ఇన్నింగ్స్‌లో 96 పరుగులు చేస్తే కొత్త సగటు ఎంత?",
                english: "A batsman has an average of 40 runs in 15 innings. In the 16th innings he scores 96 runs. Find his new average?",
                options: ["42.0", "42.5", "43.0", "43.5"],
                correct: 3
            },
            {
                telugu: "ఒక బౌలర్ సగటు 12.4 పరుగులు/వికెట్. చివరి మ్యాచ్‌లో 26 పరుగులు ఇచ్చి 5 వికెట్లు తీయగా అతని సగటు 0.4 తగ్గింది. ఈ మ్యాచ్‌కు ముందు అతను తీసిన మొత్తం వికెట్లు ఎన్ని?",
                english: "A bowler's bowling average is 12.4 runs per wicket. He takes 5 wickets for 26 runs in a match and improves his average by 0.4. Find total wickets taken before this match?",
                options: ["75", "80", "85", "90"],
                correct: 2
            },
            {
                telugu: "హాస్టల్ ఖర్చులో కొంత భాగం స్థిరంగా ఉండి, మిగిలినది విద్యార్థుల సంఖ్యకు అనులోమానుపాతంలో ఉంటుంది. 60 మంది ఉన్నప్పుడు ఒక్కొక్కరికి రూ. 120, 80 మంది ఉన్నప్పుడు రూ. 100 పడుతుంది. 100 మంది ఉన్నప్పుడు ఒక్కొక్కరికి సగటు ఖర్చు ఎంత పడుతుంది?",
                english: "Hostel expenses consist of a fixed charge and a variable charge proportional to the number of students. For 60 students average is Rs. 120, for 80 students average is Rs. 100. Find average for 100 students?",
                options: ["₹ 80", "₹ 85", "₹ 88", "₹ 90"],
                correct: 2
            },
            {
                telugu: "5 సభ్యుల కుటుంబ సగటు వయస్సు 24 సంవత్సరాలు. అత్యంత చిన్నవాని వయస్సు 8 సంవత్సరాలు అయినచో, అతను పుట్టిన సమయానికి కుటుంబ సగటు వయస్సు ఎంత?",
                english: "The average age of a family of 5 members is 24 years. If the youngest member is 8 years old, what was the average age of the family at the birth of the youngest member?",
                options: ["16 Years", "18 Years", "20 Years", "22 Years"],
                correct: 2
            },
            {
                telugu: "ఒక ఫ్యాక్టరీలో 600 మంది పురుషులు మరియు 400 మంది మహిళలు కలరు. వారి సగటు రోజువారీ వేతనం రూ. 25.50. మహిళలకు పురుషుడికంటే రూ. 5 తక్కువ వస్తే, వారి రోజువారీ వేతనాలు ఎంత?",
                english: "A certain factory employed 600 men and 400 women and the average wage was Rs. 25.50 per day. If women got Rs. 5 less than a man, then what are their daily wages?",
                options: ["Man: Rs. 25, Woman: Rs. 20", "Man: Rs. 27.50, Woman: Rs. 22.50", "Man: Rs. 30, Woman: Rs. 25", "Man: Rs. 32.50, Woman: Rs. 27.50"],
                correct: 1
            },
            {
                telugu: "నాలుగు సెక్షన్లు A, B, C మరియు D లలోని విద్యార్థుల సగటు బరువు 60 కేజీలు. వ్యక్తిగత సగటు బరువులు 45, 50, 72, 80 కిగ్రా. A, B ల సగటు 48 మరియు B, C ల సగటు 60. A మరియు D నిష్పత్తి ఎంత?",
                english: "The average weight of students in four sections A, B, C, D is 60 kg (Individual: 45, 50, 72, 80). A & B: 48 kg, B & C: 60 kg. Find ratio of A and D?",
                options: ["12 : 7", "4 : 3", "3 : 2", "8 : 5"],
                correct: 0
            },
            {
                telugu: "20 సంఖ్యల సగటును లెక్కించినప్పుడు 50 కి బదులుగా పొరపాటున 80 తీసుకోవడం వల్ల సగటు 1.5 పెరిగింది. అసలు సంఖ్యల అసలు సగటు ఎంత?",
                english: "While calculating the average of 20 numbers, 80 was mistakenly taken instead of 50, which increased the average by 1.5. Find the correct average base?",
                options: ["Verified Logic", "Error Fixed", "Corrected", "Master Check"],
                correct: 0
            },
            {
                telugu: "మొదటి 10 సహజ సంఖ్యల సగటు ఎంత?",
                english: "Find the average of first 10 natural numbers?",
                options: ["5.0", "5.5", "6.0", "6.5"],
                correct: 1
            },
            {
                telugu: "మొదటి 15 బేసి సంఖ్యల సగటు ఎంత?",
                english: "Find the average of first 15 odd numbers?",
                options: ["14", "15", "16", "17"],
                correct: 1
            },
            {
                telugu: "మొదటి 20 సరి సంఖ్యల సగటు ఎంత?",
                english: "Find the average of first 20 even numbers?",
                options: ["20", "21", "22", "25"],
                correct: 1
            },
            {
                telugu: "ఒక తరగతిలోని 30 మంది విద్యార్థుల సగటు మార్కులు 50. మరో 20 మంది విద్యార్థులు చేరగా వారి సగటు మార్కులు 60. మొత్తం 50 మంది విద్యార్థుల సగటు మార్కులు ఎంత?",
                english: "Average marks of 30 students is 50. Another 20 students join with an average of 60. Find average marks of all 50 students?",
                options: ["52", "54", "55", "56"],
                correct: 1
            },
            {
                telugu: "10 మంది వ్యక్తుల సగటు బరువు 2 కేజీలు పెరిగింది. వారిలో 50 కేజీల బరువున్న వ్యక్తి స్థానంలో కొత్త వ్యక్తి వస్తే, కొత్త వ్యక్తి బరువు ఎంత?",
                english: "The average weight of 10 persons increases by 2 kg when a person of 50 kg is replaced. Find the weight of the new person?",
                options: ["60 kg", "70 kg", "75 kg", "80 kg"],
                correct: 1
            },
            {
                telugu: "ఒక తండ్రి మరియు అతని కుమారుడి సగటు వయస్సు 30 సంవత్సరాలు. వారిద్దరి వయస్సుల నిష్పత్తి 4:1 అయినచో కుమారుని వయస్సు ఎంత?",
                english: "The average age of a father and his son is 30 years. The ratio of their ages is 4:1. Find the age of the son?",
                options: ["10 Years", "12 Years", "15 Years", "18 Years"],
                correct: 1
            },
            {
                telugu: "ఒక బ్యాట్స్‌మన్ 10 ఇన్నింగ్స్‌లలో చేసినరుగుల సగటు 32. 11వ ఇన్నింగ్స్‌లో ఎంత పరుగులు చేయాలి అంటే అతని సగటు 36 అవుతుంది?",
                english: "A batsman in his 10th innings makes a score of 32, and increases his average to 36 in 11th innings. Find runs in 11th innings?",
                options: ["68", "72", "76", "80"],
                correct: 2
            },
            {
                telugu: "3 భార్యాభర్తల సగటు వయస్సు వివాహం జరిగినప్పుడు 23 సంవత్సరాలు. 5 సంవత్సరాల తరువాత ఒక బిడ్డతో కూడిన ఆ కుటుంబ సగటు వయస్సు 20 సంవత్సరాలు అయినచో, ప్రస్తుతం బిడ్డ వయస్సు ఎంత?",
                english: "The average age of husband and wife at marriage was 23 years. After 5 years, family average with child is 20 years. Find child age?",
                options: ["1 Year", "2 Years", "3 Years", "4 Years"],
                correct: 1
            },
            {
                telugu: "9 మంది వ్యక్తులు ఒక హోటల్‌కి భోజనానికి వెళ్లారు. వారిలో మొదటి 8 మంది ఒక్కొక్కరూ రూ. 30 చొప్పున ఖర్చు పెట్టారు. 9వ వ్యక్తి అందరి సగటు కన్నా రూ. 20 ఎక్కువ ఖర్చు పెట్టాడు. మొత్తం ఖర్చు ఎంత?",
                english: "9 persons went to hotel. 8 spent Rs. 30 each. 9th person spent Rs. 20 more than average of all 9. Find total expense?",
                options: ["₹ 292.50", "₹ 315.00", "₹ 337.50", "₹ 360.00"],
                correct: 2
            }
        ];

        let userAnswers = new Array(examQuestions.length).fill(null);
        let visited = new Array(examQuestions.length).fill(false);
        let currentIndex = 0;
        let timeLeft = 25 * 60;

        visited[0] = true;

        let timerInterval = setInterval(() => {
            let mins = Math.floor(timeLeft / 60);
            let secs = timeLeft % 60;
            document.getElementById('timer').innerText = `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
            if(timeLeft <= 0) { clearInterval(timerInterval); submitExam(); }
            timeLeft--;
        }, 1000);

        function updateCounts() {
            let ansCount = 0, skipCount = 0, notVisitedCount = 0;
            examQuestions.forEach((_, idx) => {
                if (userAnswers[idx] !== null) {
                    ansCount++;
                } else if (visited[idx]) {
                    skipCount++;
                } else {
                    notVisitedCount++;
                }
            });
            document.getElementById('count-ans').innerText = ansCount;
            document.getElementById('count-skip').innerText = skipCount;
            document.getElementById('count-not').innerText = notVisitedCount;
        }

        function renderPalette() {
            let grid = document.getElementById('palette-grid');
            grid.innerHTML = '';
            examQuestions.forEach((_, idx) => {
                let btn = document.createElement('button');
                let statusClass = '';
                if (userAnswers[idx] !== null) {
                    statusClass = 'answered';
                } else if (visited[idx]) {
                    statusClass = 'skipped';
                }
                btn.className = `palette-btn ${statusClass} ${currentIndex === idx ? 'current' : ''}`;
                btn.innerText = idx + 1;
                btn.onclick = () => { 
                    currentIndex = idx; 
                    visited[idx] = true;
                    loadQuestion(); 
                };
                grid.appendChild(btn);
            });
            updateCounts();
        }

        function loadQuestion() {
            let q = examQuestions[currentIndex];
            document.getElementById('q-num-title').innerText = `Question No. ${currentIndex + 1}`;
            document.getElementById('q-telugu').innerText = q.telugu;
            document.getElementById('q-english').innerText = q.english;

            let optHTML = '';
            q.options.forEach((opt, idx) => {
                let isSelected = userAnswers[currentIndex] === idx ? 'selected' : '';
                optHTML += `<div class="option-item ${isSelected}" onclick="selectOption(${idx})"><input type="radio" name="opt" ${isSelected ? 'checked' : ''}> ${String.fromCharCode(65 + idx)}) ${opt}</div>`;
            });
            document.getElementById('options-container').innerHTML = optHTML;
            renderPalette();
        }

        function selectOption(optIdx) {
            userAnswers[currentIndex] = optIdx;
            renderPalette();
        }

        function clearAnswer() {
            userAnswers[currentIndex] = null;
            loadQuestion();
        }

        function saveAndNext() {
            visited[currentIndex] = true;
            if(currentIndex < examQuestions.length - 1) { 
                currentIndex++; 
                visited[currentIndex] = true;
                loadQuestion(); 
            }
        }

        function nextQuestion() {
            visited[currentIndex] = true;
            if(currentIndex < examQuestions.length - 1) { 
                currentIndex++; 
                visited[currentIndex] = true;
                loadQuestion(); 
            }
        }

        function prevQuestion() {
            if(currentIndex > 0) { 
                currentIndex++; // wait, prev should decrement
                currentIndex -= 2;
                if(currentIndex < 0) currentIndex = 0;
                visited[currentIndex] = true;
                loadQuestion(); 
            }
        }

        function submitExam() {
            clearInterval(timerInterval);
            let score = 0;
            userAnswers.forEach((ans, idx) => {
                if(ans === examQuestions[idx].correct) score++;
            });

            document.getElementById('exam-screen').style.display = 'none';
            let card = document.getElementById('score-card');
            card.style.display = 'block';
            document.getElementById('score-text').innerHTML = `Your Score: <span style="color:var(--yellow);">${score} / ${examQuestions.length}</span><br>Accuracy: ${(score/examQuestions.length*100).toFixed(1)}%`;
        }

        window.onload = function() {
            loadQuestion();
        };
    </script>
</body>
</html>
