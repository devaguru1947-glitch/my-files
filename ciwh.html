<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAHUL ACADEMY - Magic Wheel SI & CI Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Noto+Sans+Telugu:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0b1120; --primary: #38bdf8; --secondary: #818cf8;
            --text-light: #f8fafc; --card-bg: #1e293b; --yellow: #fde047;
            --pink: #ec4899; --green: #15803d; --blue: #1d4ed8; --red: #b91c1c;
        }

        * { 
            box-sizing: border-box; margin: 0; padding: 0; 
            -webkit-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        body { 
            font-family: 'Noto Sans Telugu', 'Montserrat', sans-serif; 
            background: var(--bg-color); color: var(--text-light); 
            line-height: 1.4; min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden;
        }

        .watermark {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-30deg);
            font-size: 6rem; font-weight: 900; color: rgba(255, 255, 255, 0.03);
            pointer-events: none; z-index: 0; white-space: nowrap; letter-spacing: 5px;
        }

        header { 
            text-align: center; padding: 10px; background: linear-gradient(90deg, #1e293b, #0b1120); 
            border-bottom: 2px solid var(--primary); z-index: 10; flex-shrink: 0;
        }
        h1 { color: var(--primary); font-size: 1.2rem; font-weight: 900; text-transform: uppercase; letter-spacing: 1px;}
        .subtitle { font-size: 0.85rem; color: var(--yellow); font-weight: 700; margin-top: 2px;}

        /* MAIN CONTAINER: TOP QUESTION + BOTTOM WHEEL AND WRITING SPACE */
        .main-container {
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 15px;
            flex-grow: 1; padding: 12px; z-index: 2; width: 100%; max-width: 1400px; margin: 0 auto;
        }

        /* TOP QUESTION WORKSPACE */
        .workspace {
            width: 100%; max-width: 900px; background: var(--card-bg); border-radius: 12px;
            border: 2px solid #334155; padding: 15px; box-shadow: 0 8px 25px rgba(0,0,0,0.5);
            display: flex; flex-direction: column; opacity: 0; transition: opacity 0.5s;
        }
        .workspace.visible { opacity: 1; }

        .q-statement {
            font-size: 1.05rem; font-weight: 700; color: #fff; text-align: center; margin-bottom: 10px;
            background: #0f172a; padding: 12px; border-radius: 8px; border-left: 4px solid var(--yellow);
            line-height: 1.5;
        }
        .highlight { color: var(--yellow); font-size: 1.25rem;}

        .btn-reveal {
            align-self: center; background: var(--pink); color: #fff; border: none;
            padding: 8px 25px; border-radius: 8px; font-size: 0.9rem; font-weight: 800;
            cursor: pointer; transition: 0.3s; margin-bottom: 10px; box-shadow: 0 4px 12px rgba(236, 72, 153, 0.4);
        }
        .btn-reveal:hover { background: #be185d; transform: translateY(-2px);}

        .answer-grid { display: grid; grid-template-columns: 1fr; gap: 8px; display: none; }
        .answer-grid.visible { display: grid; animation: fadeIn 0.5s forwards; }

        .ans-box {
            background: #0f172a; border: 2px solid #334155; border-radius: 8px; padding: 10px; text-align: center;
        }
        .ans-box h3 { font-size: 0.75rem; color: #94a3b8; margin-bottom: 4px; text-transform: uppercase;}
        .ans-box .val { font-size: 1.3rem; font-weight: 900; }
        
        .ans-box.si .val { color: var(--primary); }
        .ans-box.ci .val { color: var(--green); }
        .ans-box.diff .val { color: var(--pink); }

        /* BOTTOM SECTION FOR WHEEL & MASSIVE WRITING SPACE */
        .bottom-section {
            display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; gap: 15px;
        }

        /* WHEEL DESIGN */
        .wheel-container {
            position: relative; width: 280px; height: 280px;
            border-radius: 50%; box-shadow: 0 10px 25px rgba(0,0,0,0.8);
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }

        .pointer {
            position: absolute; top: -12px; left: 50%; transform: translateX(-50%);
            width: 0; height: 0; border-left: 12px solid transparent;
            border-right: 12px solid transparent; border-top: 25px solid var(--yellow);
            z-index: 20; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.5));
        }

        .ring {
            position: absolute; border-radius: 50%; border: 2px solid #000;
            transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99);
            display: flex; justify-content: center; align-items: center;
        }
        
        .ring::after {
            content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; border-radius: 50%;
            background: repeating-conic-gradient(from -22.5deg, transparent 0, transparent calc(45deg - 2px), rgba(0,0,0,0.7) calc(45deg - 2px), rgba(0,0,0,0.7) 45deg);
            pointer-events: none; z-index: 5;
        }

        .ring-outer { width: 280px; height: 280px; background: var(--green); z-index: 1; }
        .ring-middle { width: 205px; height: 205px; background: var(--blue); z-index: 2; box-shadow: 0 0 8px rgba(0,0,0,0.5); }
        .ring-inner { width: 135px; height: 135px; background: var(--red); z-index: 3; box-shadow: 0 0 8px rgba(0,0,0,0.5); }

        .segment {
            position: absolute; left: 50%; bottom: 50%; transform-origin: bottom center;
            text-align: center; font-weight: 800; color: #fff; z-index: 2;
        }
        .outer-text { width: 50px; height: 140px; transform: translateX(-50%); padding-top: 5px; font-size: 0.7rem; color: #fde047;}
        .middle-text { width: 45px; height: 102px; transform: translateX(-50%); padding-top: 5px; font-size: 0.75rem; }
        .inner-text { width: 40px; height: 68px; transform: translateX(-50%); padding-top: 4px; font-size: 0.6rem; line-height: 1.1; }

        .center-logo {
            position: absolute; width: 80px; height: 80px; background: #fef08a;
            border-radius: 50%; z-index: 4; display: flex; flex-direction: column; align-items: center; justify-content: center;
            border: 2px solid #000; box-shadow: 0 0 10px rgba(0,0,0,0.6); color: #b91c1c; text-align: center;
        }
        .center-logo .logo-text { font-size: 0.6rem; font-weight: 900; line-height: 1.1; margin-bottom: 1px;}
        .center-logo .logo-icon { font-size: 1.2rem; line-height: 1; color: #000; margin-bottom: 1px;}
        .center-logo .logo-number { font-size: 0.55rem; font-weight: 900; color: #000;}

        .center-btn {
            position: absolute; width: 32px; height: 32px; background: linear-gradient(145deg, #e2e8f0, #94a3b8);
            border-radius: 50%; z-index: 10; display: flex; align-items: center; justify-content: center;
            font-size: 0.6rem; font-weight: 900; color: #000; cursor: pointer; border: 2px solid #fff;
            box-shadow: 0 2px 6px rgba(0,0,0,0.5); transition: 0.2s;
        }
        .center-btn:hover { transform: scale(1.1); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* DESKTOP MEDIA QUERY */
        @media (min-width: 768px) {
            h1 { font-size: 1.6rem; }
            .subtitle { font-size: 1rem; }
            .bottom-section { flex-direction: row; justify-content: space-around; }
            .wheel-container { width: 340px; height: 340px; }
            .ring-outer { width: 340px; height: 340px; }
            .ring-middle { width: 250px; height: 250px; }
            .ring-inner { width: 165px; height: 165px; }
            .outer-text { width: 60px; height: 170px; font-size: 0.8rem; }
            .middle-text { width: 55px; height: 125px; font-size: 0.85rem; }
            .inner-text { width: 48px; height: 82px; font-size: 0.7rem; }
            .center-logo { width: 100px; height: 100px; }
            .center-logo .logo-text { font-size: 0.75rem; }
            .center-logo .logo-icon { font-size: 1.6rem; }
            .center-logo .logo-number { font-size: 0.7rem; }
            .center-btn { width: 38px; height: 38px; font-size: 0.7rem; }
            .workspace { padding: 20px; }
            .q-statement { font-size: 1.2rem; padding: 15px; }
            .highlight { font-size: 1.45rem; }
            .answer-grid { grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
            .ans-box .val { font-size: 1.6rem; }
        }
    </style>
</head>
<body ondblclick="toggleFullScreen()" oncopy="return false;" oncut="return false;" onpaste="return false;" oncontextmenu="return false;">

    <div class="watermark">RAHUL ACADEMY</div>

    <header>
        <h1>RAHUL ACADEMY</h1>
        <div class="subtitle">🎯 Spin The Magic Wheel : SI & CI Game</div>
    </header>

    <div class="main-container">
        
        <!-- TOP WORKSPACE (QUESTION & ANSWERS) -->
        <div class="workspace" id="workspace">
            <div class="q-statement" id="q-statement">
                Code <span class="highlight" id="q-code">...</span> Generated!<br>
                Find S.I, C.I and their Difference for<br>
                P = <span class="highlight" id="q-p">...</span>, R = <span class="highlight" id="q-r">...</span>, T = <span class="highlight" id="q-t">...</span>
            </div>

            <button class="btn-reveal" onclick="revealAnswers()">👁️ Reveal Concept Answers</button>

            <div class="answer-grid" id="answer-grid">
                <div class="ans-box si">
                    <h3>Simple Interest (S.I)</h3>
                    <div class="val" id="ans-si">₹0</div>
                </div>
                <div class="ans-box ci">
                    <h3>Compound Interest (C.I)</h3>
                    <div class="val" id="ans-ci">₹0</div>
                </div>
                <div class="ans-box diff">
                    <h3>Difference (C.I - S.I)</h3>
                    <div class="val" id="ans-diff">₹0</div>
                </div>
            </div>
        </div>

        <!-- BOTTOM SECTION (WHEEL) -->
        <div class="bottom-section">
            <div class="wheel-container">
                <div class="pointer"></div>
                
                <div class="ring ring-outer" id="ring-outer"></div>
                <div class="ring ring-middle" id="ring-middle"></div>
                <div class="ring ring-inner" id="ring-inner"></div>

                <div class="center-logo">
                    <div class="logo-text">RAHUL<br>ACADEMY</div>
                    <div class="logo-icon">🐎</div>
                    <div class="logo-number">8978741904</div>
                </div>

                <div class="center-btn" onclick="spinWheel()">SPIN</div>
            </div>
        </div>

    </div>

    <script>
        function toggleFullScreen() {
            var doc = window.document;
            var docEl = doc.documentElement;
            var requestFullScreen = docEl.requestFullscreen || docEl.webkitRequestFullscreen || docEl.msRequestFullscreen;
            var cancelFullScreen = doc.exitFullscreen || doc.webkitExitFullscreen || doc.msExitFullscreen;
            if(!doc.fullscreenElement && !doc.webkitFullscreenElement && !doc.msFullscreenElement) {
                requestFullScreen.call(docEl).catch(err => console.log(err));
            } else { cancelFullScreen.call(doc); }
        }

        const principals = [
            { code: "1", val: 5000, label: "5,000 | 1" },
            { code: "2", val: 20000, label: "20,000 | 2" },
            { code: "3", val: 4000, label: "4,000 | 3" },
            { code: "4", val: 15000, label: "15,000 | 4" },
            { code: "5", val: 60000, label: "60,000 | 5" },
            { code: "6", val: 12000, label: "12,000 | 6" },
            { code: "7", val: 1000, label: "1,000 | 7" },
            { code: "8", val: 10000, label: "10,000 | 8" }
        ];

        const rates = [
            { code: "D", val: 10, label: "10% D" },
            { code: "E", val: 24, label: "24% E" },
            { code: "F", val: 16, label: "16% F" },
            { code: "G", val: 12, label: "12% G" },
            { code: "H", val: 2, label: "2% H" },
            { code: "A", val: 6, label: "6% A" },
            { code: "B", val: 8, label: "8% B" },
            { code: "C", val: 4, label: "4% C" }
        ];

        const times = [
            { code: "V", text: "2.5 Years", t: 2.5, type: "yearly", label: "2 1/2 Yrs V" },
            { code: "VI", text: "5 Years", t: 5, type: "yearly", label: "5 Yrs VI" },
            { code: "VII", text: "1 Year (Quarterly)", t: 1, type: "quarterly", label: "1 Yr Qtrly VII" },
            { code: "VIII", text: "1.5 Yrs (Half-Yearly)", t: 1.5, type: "half-yearly", label: "1.5 Yr Half VIII" },
            { code: "I", text: "2 Years", t: 2, type: "yearly", label: "2 Yrs I" },
            { code: "II", text: "1.5 Years", t: 1.5, type: "yearly", label: "1 1/2 Yrs II" },
            { code: "III", text: "3 Years", t: 3, type: "yearly", label: "3 Yrs III" },
            { code: "IV", text: "4 Years", t: 4, type: "yearly", label: "4 Yrs IV" }
        ];

        function drawWheel() {
            const outer = document.getElementById('ring-outer');
            const middle = document.getElementById('ring-middle');
            const inner = document.getElementById('ring-inner');

            let oHTML = '', mHTML = '', iHTML = '';
            for(let i=0; i<8; i++) {
                let rot = i * 45;
                oHTML += `<div class="segment outer-text" style="transform: translateX(-50%) rotate(${rot}deg);">${principals[i].label}</div>`;
                mHTML += `<div class="segment middle-text" style="transform: translateX(-50%) rotate(${rot}deg);">${rates[i].label}</div>`;
                iHTML += `<div class="segment inner-text" style="transform: translateX(-50%) rotate(${rot}deg);">${times[i].label}</div>`;
            }
            outer.innerHTML = oHTML; middle.innerHTML = mHTML; inner.innerHTML = iHTML;
        }

        drawWheel();

        let outerRot = 0, middleRot = 0, innerRot = 0;
        let selectedP, selectedR, selectedT;

        function spinWheel() {
            document.getElementById('workspace').classList.remove('visible');
            document.getElementById('answer-grid').classList.remove('visible');

            let r1 = Math.floor(Math.random() * 8);
            let r2 = Math.floor(Math.random() * 8);
            let r3 = Math.floor(Math.random() * 8);
            
            outerRot = outerRot + 1800 + (360 - (r1 * 45) - (outerRot % 360));
            middleRot = middleRot + 2160 + (360 - (r2 * 45) - (middleRot % 360));
            innerRot = innerRot + 2520 + (360 - (r3 * 45) - (innerRot % 360));

            document.getElementById('ring-outer').style.transform = `rotate(${outerRot}deg)`;
            document.getElementById('ring-middle').style.transform = `rotate(${middleRot}deg)`;
            document.getElementById('ring-inner').style.transform = `rotate(${innerRot}deg)`;

            selectedP = principals[r1];
            selectedR = rates[r2];
            selectedT = times[r3];

            setTimeout(() => {
                document.getElementById('q-code').innerText = `${selectedP.code}-${selectedR.code}-${selectedT.code}`;
                document.getElementById('q-p').innerText = `₹${selectedP.val.toLocaleString()}`;
                document.getElementById('q-r').innerText = `${selectedR.val}% p.a`;
                document.getElementById('q-t').innerText = selectedT.text;
                
                document.getElementById('workspace').classList.add('visible');
            }, 4000);
        }

        function revealAnswers() {
            let p = selectedP.val;
            let r = selectedR.val;
            let t = selectedT.t;
            let type = selectedT.type;

            let si = (p * t * r) / 100;
            let amount = 0;
            
            let amountVal = 0;
            if(type === 'yearly') {
                let wholeYears = Math.floor(t);
                let fracYear = t - wholeYears;
                amountVal = p * Math.pow((1 + r/100), wholeYears);
                if(fracYear > 0) amountVal = amountVal * (1 + (fracYear * r)/100);
            } else if (type === 'half-yearly') {
                amountVal = p * Math.pow((1 + (r/2)/100), t * 2);
            } else if (type === 'quarterly') {
                amountVal = p * Math.pow((1 + (r/4)/100), t * 4);
            }

            let ci = amountVal - p;
            let diff = Math.abs(ci - si);

            document.getElementById('ans-si').innerText = `₹${formatNumber(si)}`;
            document.getElementById('ans-ci').innerText = `₹${formatNumber(ci)}`;
            document.getElementById('ans-diff').innerText = `₹${formatNumber(diff)}`;

            document.getElementById('answer-grid').classList.add('visible');
        }

        function formatNumber(num) {
            if(num % 1 === 0) return num.toLocaleString('en-IN');
            return num.toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2});
        }
    </script>
</body>
</html>
