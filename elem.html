        .table-wrapper { width: 100%; max-width: 1500px; overflow-x: auto; padding-bottom: 20px; }

        .periodic-table {
            display: grid; 
            grid-template-columns: repeat(18, minmax(65px, 1fr)); 
            grid-template-rows: repeat(10, minmax(65px, 1fr));
            gap: 6px; 
            width: 100%; 
            min-width: 1200px;
            margin-top: 10px;
        }

        .element {
            background: rgba(30, 41, 59, 0.85); border: 1px solid rgba(255,255,255,0.2); border-radius: 6px;
            padding: 6px 2px; display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.3s ease; position: relative; aspect-ratio: 1 / 1.1; backdrop-filter: blur(5px);
        }
        .element:hover { transform: scale(1.2); z-index: 20; box-shadow: 0 10px 25px rgba(0,0,0,0.8); border-color: #fff; }
        .element.has-data { border-width: 1.5px; }
        .element.has-data::after { content: '✨'; position: absolute; top: -2px; right: -2px; font-size: 0.6rem; animation: pulse 1.5s infinite;}

        @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.3); opacity: 0.5; } }

        .el-number { font-size: 0.6rem; font-weight: 700; align-self: flex-start; margin-left: 3px; opacity: 0.8;}
        .el-symbol { font-size: 1.25rem; font-weight: 900; line-height: 1.1; text-shadow: 1px 1px 2px rgba(0,0,0,0.8);}
        .el-name { font-size: 0.52rem; font-weight: 600; text-transform: uppercase; opacity: 0.9; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%;}

        .alkali { background: var(--alkali); border-color: var(--alkali-border); }
        .alkaline { background: var(--alkaline); border-color: var(--alkaline-border); }
        .transition { background: var(--transition); border-color: var(--transition-border); }
        .posttrans { background: var(--posttrans); border-color: var(--posttrans-border); }
        .metalloid { background: var(--metalloid); border-color: var(--metalloid-border); }
        .nonmetal { background: var(--nonmetal); border-color: var(--nonmetal-border); }
        .halogen { background: var(--halogen); border-color: var(--halogen-border); }
        .noble { background: var(--noble); border-color: var(--noble-border); }
        .lanthanide { background: var(--lanthanide); border-color: var(--lanthanide-border); }
        .actinide { background: var(--actinide); border-color: var(--actinide-border); }

            display: none; justify-content: center; align-items: center; z-index: 100;

        .atom-container {

        .nucleus {

        .orbit {

            border: 3px solid var(--orbit-color); border-radius: 50%;
            box-shadow: inset 0 0 10px var(--orbit-color), 0 0 15px var(--orbit-color);
            transform-style: preserve-3d;

        .orbit-2 { animation: spin2 4s linear infinite; }
        .orbit-3 { animation: spin3 4s linear infinite; }

        @keyframes spin2 { 0% { transform: rotateX(75deg) rotateY(60deg) rotateZ(0deg); } 100% { transform: rotateX(75deg) rotateY(60deg) rotateZ(360deg); } }

        @media (max-width: 900px) {
            .modal-content { flex-direction: column; height: 95vh; overflow-y: auto;}
            .modal-left, .modal-right { width: 100%; border-right: none; }
            .modal-left { height: 320px; flex-shrink: 0; padding: 20px;}
            .modal-css-art { height: 180px; flex: none; }
        }
    </style>

                "A highly unstable radioactive element that decays within milliseconds of being created.",
                "Discovered at the GSI lab in Germany by Peter Armbruster and Gottfried Münzenberg.",
                "Located in Group 8 of the periodic table, below iron and ruthenium.",
                "Key to research regarding the 'Island of Stability' for super-heavy elements.",
                "Impossible to isolate or observe under normal conditions.",
                "Created solely for the purpose of scientific research.",
                "Has an atomic number of 108.",
                "Clearer research into the physical properties of this element is still ongoing."
            ]}
        ];

        // GENERIC CLEAN FACTS FOR REMAINING ELEMENTS
        function fillRemainingElements() {
            for (let i = 1; i <= 108; i++) {
                let existing = elementsData.find(e => e.num === i);
                if (!existing) {
                    let g = 1, p = 1, cat = "transition", fullCat = "Transition Metal", core = "#38bdf8", orbit = "rgba(56,189,248,0.6)";
                    
                    if (i === 25) { g=7; p=4; cat="transition"; fullCat="Group 7 • Transition Metal"; core="#475569"; }
                    else if (i >= 31 && i <= 34) { g = i - 18; p = 4; cat = (i===33||i===32)? "metalloid":"posttrans"; fullCat="Period 4 Element"; }
                    else if (i >= 36 && i <= 46) { g = i - 35; p = 5; cat = (i===36)?"noble":"transition"; fullCat="Period 5 Element"; }
                    else if (i >= 48 && i <= 52) { g = i - 35; p = 5; cat = (i===51||i===52)?"metalloid":"posttrans"; fullCat="Period 5 Element"; }
                    else if (i >= 54 && i <= 73) { g = (i <= 56) ? i - 53 : (i - 71); p = (i <= 56) ? 5 : 6; cat = (i===54)?"noble":(i===57)?"lanthanide":"transition"; }
                    else if (i >= 75 && i <= 77) { g = i - 68; p = 6; cat = "transition"; }
                    else if (i >= 81 && i <= 87) { g = i - 67; p = 6; cat = (i===84)?"metalloid":(i===85||i===87)?"halogen":"posttrans"; }
                    else if (i >= 89 && i <= 107) { g = (i===89)?3:((i>=90&&i<=103)? (i-87) : (i-95)); p = (i<=103)?7:7; cat=(i>=90&&i<=103)?"actinide":"transition"; }
                    else {
                        g = ((i - 1) % 18) + 1;
                        p = Math.floor((i - 1) / 18) + 1;
                    }

                    elementsData.push({
                        num: i,
                        sym: `E${i}`,
                        name: `Element ${i}`,
                        group: g,
                        period: p,
                        cat: cat,
                        fullCat: fullCat,
                        coreColor: core,
                        orbitColor: orbit,
                        caption: `Atomic Model of Element ${i}`,
                        facts: [
                            `This element with atomic number ${i} belongs to the <b>${fullCat}</b> category in the periodic table.`,
                            `Its electron configuration and valency play a key role in its chemical reactions.`,
                            `Oxides and other compounds of this element possess distinct physical and chemical properties.`,
                            `Its isotopes and atomic weight are important topics for competitive exams.`,
                            `Applications for this element are currently under research in modern material science and nanotechnology.`,
                            `Its spectral lines exhibit specific and exact wavelengths.`,
                            `It forms unique chemical bonds when reacted with other elements.`,
                            `Its physical state and behavior differ significantly at extreme temperatures and pressures.`,
                            `Its natural abundance or laboratory synthesis is an important aspect of science and technology.`,
                            `Uses in industrial products or chemical analysis are frequently tested topics.`
                        ]
                    });
                }
            }
        }

        function renderPeriodicTable() {
            fillRemainingElements();
            const tableElement = document.getElementById('periodic-table');
            tableElement.innerHTML = '';
            
            elementsData.forEach(el => {
                const elDiv = document.createElement('div');
                let extraClass = (el.facts && el.facts.length >= 10) ? 'has-data' : '';
                elDiv.className = `element ${el.cat} ${extraClass}`;
                elDiv.style.gridColumn = el.group;
                elDiv.style.gridRow = el.period;
                
                elDiv.innerHTML = `
                    <div class="el-number">${el.num}</div>
                    <div class="el-symbol">${el.sym}</div>
                    <div class="el-name">${el.name}</div>
                `;

                elDiv.onclick = () => openModal(el);
                tableElement.appendChild(elDiv);
            });
        }

        function openModal(el) {
            document.getElementById('m-num').innerText = el.num;
            document.getElementById('m-sym').innerText = el.sym;
            document.getElementById('m-name').innerText = el.name;
            document.getElementById('m-group').innerText = el.fullCat || "Advanced Element";
            document.getElementById('m-img-caption').innerText = el.caption || `Atomic Model of ${el.name}`;
            
            document.documentElement.style.setProperty('--core-color', el.coreColor || '#38bdf8');
            document.documentElement.style.setProperty('--orbit-color', el.orbitColor || 'rgba(56, 189, 248, 0.6)');
            
            const colorMap = {
                'transition': 'var(--transition-border)',
                'alkali': 'var(--alkali-border)',
                'nonmetal': 'var(--nonmetal-border)',
                'noble': 'var(--noble-border)',
                'halogen': 'var(--halogen-border)',
                'posttrans': 'var(--posttrans-border)',
                'metalloid': 'var(--metalloid-border)',
                'alkaline': 'var(--alkaline-border)',
                'lanthanide': 'var(--lanthanide-border)',
                'actinide': 'var(--actinide-border)'
            };
            document.getElementById('m-cat-bg').style.background = colorMap[el.cat] || 'var(--primary)';

            const factsList = document.getElementById('m-facts');
            factsList.innerHTML = '';
            
            el.facts.forEach(fact => {
                const li = document.createElement('li');
                li.innerHTML = fact;
                factsList.appendChild(li);
            });

            document.getElementById('element-modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('element-modal').classList.remove('active');
        }

        window.onload = renderPeriodicTable;
    </script>
</body>
</html>
